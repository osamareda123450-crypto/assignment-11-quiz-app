<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizMaster - Test Your Knowledge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #f8fafc;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 560px;
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
      border: 1px solid #334155;
    }

    header {
      text-align: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 2.1rem;
      color: #38bdf8;
    }

    header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .badge {
      background: #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .timer {
      color: #fbbf24;
    }

    .question-text {
      font-size: 1.25rem;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .option-btn {
      background: #334155;
      color: #f8fafc;
      text-align: left;
      border: 2px solid transparent;
    }

    .option-btn:hover:not(:disabled) {
      background: #475569;
      transform: translateY(-1px);
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #86efac;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .primary-btn {
      background: #0284c7;
      color: #ffffff;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .primary-btn:hover {
      background: #0369a1;
    }

    .center-box {
      text-align: center;
    }

    .score-circle {
      font-size: 2rem;
      font-weight: bold;
      color: #4ade80;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <main role="main">
    <header>
      <h1><i class="fa-solid fa-brain"></i> QuizMaster</h1>
      <p>Test Your Knowledge</p>
    </header>

    <div aria-label="Game area" aria-live="polite" role="region"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
